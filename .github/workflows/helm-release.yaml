name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/**'
      - 'scripts/deploy-dashboard.sh'
      - 'index.html'
      - 'styles.css'
      - 'assets/**'
  workflow_dispatch:

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect chart changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -q '^helm/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Helm
        if: steps.changed.outputs.run == 'true'
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p .helm-output
          helm package helm/ --destination .helm-output/

      - name: Checkout gh-pages branch
        if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy package and update index
        if: steps.changed.outputs.run == 'true'
        run: |
          cp .helm-output/*.tgz gh-pages/
          helm repo index gh-pages/ \
            --url https://dhruvmistry2000.github.io/kubepulse \
            --merge gh-pages/index.yaml 2>/dev/null || \
          helm repo index gh-pages/ \
            --url https://dhruvmistry2000.github.io/kubepulse

      - name: Commit and push chart to gh-pages
        if: steps.changed.outputs.run == 'true'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gh-pages
          git add .
          git diff --staged --quiet || git commit -m "ci: release helm chart from main"
          git push

  publish-dashboard-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect script changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -qx 'scripts/deploy-dashboard.sh'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages branch
        if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy dashboard deploy script
        if: steps.changed.outputs.run == 'true'
        run: |
          cp scripts/deploy-dashboard.sh gh-pages/deploy-dashboard.sh
          chmod +x gh-pages/deploy-dashboard.sh

      - name: Commit and push script to gh-pages
        if: steps.changed.outputs.run == 'true'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gh-pages
          git add deploy-dashboard.sh
          git diff --staged --quiet || git commit -m "ci: publish dashboard deploy script from main"
          git push

  publish-website:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect website changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -Eq '^(index\.html|styles\.css|assets/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages branch
        if: steps.changed.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy website
        if: steps.changed.outputs.run == 'true'
        run: |
          cp index.html styles.css gh-pages/
          mkdir -p gh-pages/assets
          cp -a assets/. gh-pages/assets/

      - name: Commit and push website to gh-pages
        if: steps.changed.outputs.run == 'true'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gh-pages
          git add index.html styles.css assets
          git diff --staged --quiet || git commit -m "ci: publish website from main"
          git push
