{{- if eq .Values.persistence.mode "secret" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-dashboard-agent.fullname" . }}-state
  labels:
    {{- include "k8s-dashboard-agent.labels" . | nindent 4 }}
rules:
  # create cannot be limited by resourceNames (the name is not known yet),
  # so the chart pre-creates the Secret and this Role only updates that object.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.stateSecretName | quote }}]
    verbs: ["get", "update", "patch"]
{{- end }}
