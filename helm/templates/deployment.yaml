apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-dashboard-agent.fullname" . }}
  labels:
    {{- include "k8s-dashboard-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "k8s-dashboard-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-dashboard-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-dashboard-agent.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- $connSecret := .Values.existingSecret | default (include "k8s-dashboard-agent.fullname" .) }}
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DASHBOARD_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $connSecret }}
                  key: DASHBOARD_URL
            - name: CLUSTER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $connSecret }}
                  key: CLUSTER_NAME
            - name: PERSISTENCE_MODE
              value: {{ .Values.persistence.mode | quote }}
            - name: STATE_SECRET_NAME
              value: {{ .Values.stateSecretName | quote }}
            - name: PERSISTENCE_FILE_PATH
              value: {{ .Values.persistence.filePath | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if or .Values.existingSecret .Values.registrationToken }}
            - name: REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $connSecret }}
                  key: REGISTRATION_TOKEN
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.persistence.mode "file" }}
            - name: agent-state
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.persistence.mode "file" }}
        - name: agent-state
          {{- if .Values.persistence.fileVolume.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "k8s-dashboard-agent.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
