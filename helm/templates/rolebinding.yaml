{{- if eq .Values.persistence.mode "secret" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-dashboard-agent.fullname" . }}-state
  labels:
    {{- include "k8s-dashboard-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-dashboard-agent.fullname" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-dashboard-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
