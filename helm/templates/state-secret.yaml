{{- if eq .Values.persistence.mode "secret" }}
{{- $secretName := .Values.stateSecretName | default "kubepulse-agent-state" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "k8s-dashboard-agent.labels" . | nindent 4 }}
  annotations:
    # Keep the credential if the release is uninstalled. helm upgrade re-reads
    # live data via lookup so a stored credential is not replaced with empty.
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- end }}
{{- end }}
