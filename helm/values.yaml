# The Deployment template always sets replicas to 1. Two agents would double-post.
replicaCount: 1

image:
  repository: dhruvmistry200/kubepulse-agent
  # Pin a release tag in production. The template does not fall back to Chart.appVersion.
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Passed with helm install --set. The chart stores them in a Secret; the agent
# reads that Secret and does not get these as plain env values.
registrationToken: ""
dashboardUrl: ""
clusterName: ""
# Optional. When set, use this Secret (keys REGISTRATION_TOKEN, DASHBOARD_URL,
# CLUSTER_NAME) instead of creating one from the values above.
existingSecret: ""

# Durable registration: persist per-cluster credential across pod restarts / helm upgrades
persistence:
  mode: secret
  filePath: /var/lib/kubepulse/credential.json
  mountPath: /var/lib/kubepulse
  fileVolume:
    enabled: false
    storageClass: ""
    size: 1Gi
    accessMode: ReadWriteOnce

# Pre-created by the chart. The agent updates this object; it cannot create
# Secrets. helm upgrade keeps existing data (lookup) and uninstall keeps the
# Secret (helm.sh/resource-policy: keep). Delete it by hand to drop the credential.
stateSecretName: kubepulse-agent-state

# The agent is a single replica. A PDB with minAvailable 1 blocks node drains,
# so it stays off unless you explicitly enable it.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

nameOverride: ""

# Off by default. Allows DNS and outbound HTTPS to the dashboard, and probes on 8080.
networkPolicy:
  enabled: false
